# Whole stack in containers (HTTPS with the development CA from dev-certs/, see docs/LOCAL_CLIENT_TESTING.md):
#   docker compose up -d --build
#   docker compose run --rm seed        # once: matchmaking pools and their beatmaps
# Postgres and Redis are also published on 127.0.0.1:3333 / :9090 for tools on the host.
services:
  app:
    build: .
    image: akatsuki-lazer-app
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:youshallnotpass@postgres:5432/osu
      REDIS_URL: redis://redis:6379/0
      PYTHONUTF8: "1"
      PATH: /app/.venv/bin:/usr/local/bin:/usr/bin:/bin
      # app/main.py reads these: SSL=true -> HTTPS with the dev certs, SSL=false -> plain HTTP (see .env.example)
      SSL: ${SSL:-true}
      SSL_KEYFILE: /certs/localhost-key.pem
      SSL_CERTFILE: /certs/localhost.pem
      USE_EXTERNAL_SPECTATOR: "true"
      SPECTATOR_INTERNAL_URL: http://spectator:8083
      USE_EXTERNAL_METADATA: "true"
      METADATA_INTERNAL_URL: http://metadata:8085
      # Replays and beatmap files: the S3_* settings from .env first (when set), then this SeaweedFS.
      SEAWEEDFS_ENDPOINT_URL: http://seaweedfs:8333
      SEAWEEDFS_BUCKET: akatsuki
      SEAWEEDFS_ACCESS_KEY: akatsuki
      SEAWEEDFS_SECRET_KEY: akatsuki-dev-secret
    entrypoint: []
    command:
      - sh
      - -c
      - >-
        alembic upgrade head && exec python -m app.main
    ports:
      - "8000:8000"
    volumes:
      - ./dev-certs:/certs:ro
      - ./cert:/app/cert:ro
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import os,ssl,urllib.request as u;s=os.environ.get('SSL','false').lower()in('1','true','yes','on');u.urlopen(('https' if s else 'http')+'://localhost:8000/',context=ssl._create_unverified_context())"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      seaweedfs:
        condition: service_healthy
    restart: unless-stopped

  # S3-compatible object store (the fallback for the S3 bucket, and the store when no S3 is configured).
  # Development credentials: docker/seaweedfs-s3.json. Use your own keys anywhere else.
  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - seaweedfs:/data
      - ./docker/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  multiplayer:
    build: ./multiplayer
    environment:
      LISTEN_ADDR: ":8081"
      SSL: ${SSL:-true}   # false: the hub ignores the TLS settings below and speaks plain HTTP
      TLS_CERT_FILE: /certs/localhost.pem
      TLS_KEY_FILE: /certs/localhost-key.pem
      PYTHON_API_URL: https://app:8000
      API_CA_FILE: /certs/ca.pem
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}
      JWT_PUBLIC_KEY_FILE: /cert/public.pem
      JWT_AUDIENCE: ${OAUTH_CLIENT_ID:-5}
    ports:
      - "8081:8081"
    volumes:
      - ./dev-certs:/certs:ro
      - ./cert:/cert:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  # Spectator hub (live gameplay streaming), built from the same image as multiplayer.
  # Client setting "Spectator socket server URL": https://localhost:8082
  spectator:
    build: ./multiplayer
    image: akatsuki-lazer-multiplayer
    entrypoint: ["/spectator"]
    environment:
      LISTEN_ADDR: ":8082"
      INTERNAL_LISTEN_ADDR: ":8083"
      SSL: ${SSL:-true}   # false: the hub ignores the TLS settings below and speaks plain HTTP
      TLS_CERT_FILE: /certs/localhost.pem
      TLS_KEY_FILE: /certs/localhost-key.pem
      PYTHON_API_URL: https://app:8000
      API_CA_FILE: /certs/ca.pem
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}
      JWT_PUBLIC_KEY_FILE: /cert/public.pem
      JWT_AUDIENCE: ${OAUTH_CLIENT_ID:-5}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8082:8082"
    volumes:
      - ./dev-certs:/certs:ro
      - ./cert:/cert:ro
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  # Metadata hub (presence, daily challenge, beatmap updates), same image as multiplayer.
  # Client setting "Metadata socket server URL": https://localhost:8084
  metadata:
    build: ./multiplayer
    image: akatsuki-lazer-multiplayer
    entrypoint: ["/metadata"]
    environment:
      LISTEN_ADDR: ":8084"
      INTERNAL_LISTEN_ADDR: ":8085"
      SSL: ${SSL:-true}   # false: the hub ignores the TLS settings below and speaks plain HTTP
      TLS_CERT_FILE: /certs/localhost.pem
      TLS_KEY_FILE: /certs/localhost-key.pem
      PYTHON_API_URL: https://app:8000
      API_CA_FILE: /certs/ca.pem
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}
      JWT_PUBLIC_KEY_FILE: /cert/public.pem
      JWT_AUDIENCE: ${OAUTH_CLIENT_ID:-5}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8084:8084"
    volumes:
      - ./dev-certs:/certs:ro
      - ./cert:/cert:ro
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  seed:
    build: .
    image: akatsuki-lazer-app   # same image as app: built once, not twice
    profiles: [tools]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:youshallnotpass@postgres:5432/osu
      REDIS_URL: redis://redis:6379/0
      PYTHONUTF8: "1"
      PATH: /app/.venv/bin:/usr/local/bin:/usr/bin:/bin
      SEAWEEDFS_ENDPOINT_URL: http://seaweedfs:8333
      SEAWEEDFS_BUCKET: akatsuki
      SEAWEEDFS_ACCESS_KEY: akatsuki
      SEAWEEDFS_SECRET_KEY: akatsuki-dev-secret
    entrypoint: []
    command: ["python", "-m", "app.seeders", "matchmaking"]
    volumes:
      - ./data:/app/data
    depends_on:
      app:
        condition: service_healthy

  redis:
    image: redis:latest
    ports:
      - "127.0.0.1:9090:6379"

  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: youshallnotpass
      POSTGRES_DB: osu
    ports:
      - "127.0.0.1:3333:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d osu"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
  seaweedfs:
